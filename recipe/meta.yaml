{% set name = "clustergram" %}
{% set version = "0.8.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0766a804781e5616baf2492ff10d4a40d6261abee87ae6e707601fe3300c7573

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61.0
    - setuptools-scm >=6.2
  run:
    - python >={{ python_min }}
    - numpy
    - matplotlib-base
    - pandas

test:
  requires:
    - python {{ python_min }}
  imports:
    - clustergram

about:
  home: https://github.com/martinfleis/clustergram
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Clustergram - visualization and diagnostics for cluster analysis
  doc_url: https://clustergram.readthedocs.io/
  dev_url: https://github.com/martinfleis/clustergram

extra:
  recipe-maintainers:
    - martinfleis
